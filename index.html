<!doctype html>
<html lang="id" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Dark is the default here: the brand ground is #1A0003, a near-black
         crimson, and the pale theme is the alternate. The two theme-color
         values are the same two, not one reversed. -->
    <meta name="theme-color" content="#1a0003" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fdf6f5" media="(prefers-color-scheme: light)" />

    <title>Sierra Mooniva - Virtual Corporate Secretary, VTuber Indonesia</title>
    <meta
      name="description"
      content="Sierra Mooniva, virtual corporate secretary yang suka main JRPG. Cover anime dan J-pop di YouTube, update harian di X."
    />
    <meta name="author" content="Sierra Mooniva" />
    <link rel="canonical" href="https://sierra-mooniva.vtube-info.xyz/" />

    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Sierra Mooniva" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:title" content="Sierra Mooniva - Virtual Corporate Secretary, VTuber Indonesia" />
    <meta
      property="og:description"
      content="Virtual Corporate Secretary yang suka playing JRPG. Cover dan fan art."
    />
    <meta property="og:url" content="https://sierra-mooniva.vtube-info.xyz/" />
    <meta property="og:image" content="https://sierra-mooniva.vtube-info.xyz/og-image.png" />
    <meta property="og:image:width" content="800" />
    <meta property="og:image:height" content="800" />
    <meta property="og:image:type" content="image/png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sierra Mooniva - Virtual Corporate Secretary" />
    <meta
      name="twitter:description"
      content="Virtual Corporate Secretary yang suka playing JRPG. Cover dan fan art."
    />
    <meta name="twitter:image" content="https://sierra-mooniva.vtube-info.xyz/og-image.png" />

    <!-- PNG, not the JPEG: the favicon sits on a near-black ground and JPEG
         ringing shows as a light halo at 16px. iOS ignores WebP too. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/media/apple-touch-icon.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Sierra Mooniva",
        "alternateName": ["@SierraMooniva"],
        "description": "Virtual Corporate Secretary who love playing JRPG. ID/EN VTuber.",
        "url": "https://sierra-mooniva.vtube-info.xyz/",
        "image": "https://sierra-mooniva.vtube-info.xyz/media/avatar-youtube.webp",
        "sameAs": [
          "https://www.youtube.com/@SierraMooniva",
          "https://x.com/SierraMooniva",
          "https://sierramooniva.framer.website"
        ]
      }
    </script>

    <script>
      // Runs before first paint so the correct token set is already on screen.
      // Without this, a dark-mode visitor eats one light flash on every load.
      // The key must match STORAGE_KEY in src/lib/useTheme.ts, or the choice is
      // written under one name and read under another and the toggle dies
      // silently.
      (function () {
        try {
          var stored = localStorage.getItem("sierra-theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme =
            stored || (prefersDark ? "dark" : "light");
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
